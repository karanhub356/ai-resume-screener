<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeAI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050508;
      --surface: #0e0e14;
      --surface2: #161622;
      --border: rgba(255,255,255,.08);
      --text: #f0f0f5;
      --muted: #8888a0;
      --accent: #7c6af7;
      --accent2: #e060fa;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(124,106,247,.25) 0%, transparent 70%); top: -150px; left: -150px; }
    .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(224,96,250,.18) 0%, transparent 70%); bottom: -100px; right: -100px; }
    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: rgba(14,14,20,.75);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 40px 120px rgba(0,0,0,.6);
      text-align: center;
    }
    .login-card .lock { font-size: 40px; margin-bottom: 16px; }
    .login-card h1 {
      font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .login-card input[type="password"] {
      width: 100%; padding: 12px 16px; font-size: 14px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      outline: none; font-family: inherit;
      transition: border-color .2s;
    }
    .login-card input[type="password"]:focus { border-color: var(--accent); }
    .login-card .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 16px; padding: 12px 20px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; border-radius: 12px; font-family: inherit;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff;
      box-shadow: 0 0 24px rgba(124,106,247,.4);
      transition: transform .2s, box-shadow .2s;
    }
    .login-card .btn:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(124,106,247,.6); }
    .login-card .error {
      color: #ff5f56; font-size: 12px; margin-top: 12px; font-weight: 600;
    }
    .login-card input[type="hidden"] { display: none; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <form class="login-card" method="post" action="/login">
    <div class="lock">🔐</div>
    <h1>ResumeAI</h1>
    <p>Enter password to access the screening dashboard</p>
    <input type="hidden" name="next" value="{{ next or '/' }}" />
    <input type="password" name="password" placeholder="Password" autofocus required />
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <button type="submit" class="btn">Unlock Dashboard</button>
  </form>
</body>
</html>
